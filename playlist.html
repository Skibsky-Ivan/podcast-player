<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Любимые треки - AudioWave</title>
    <!-- Общие стили и стили страницы плейлиста -->
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/pages/playlist.css" />
  </head>
  <body>
    <!-- Шапка сайта -->
    <header class="header container">
      <a href="main.html" class="logo">
        <span class="icon icon-audio-wave logo-icon"></span>
        <span class="logo-text">AudioWave</span>
      </a>
      <nav class="nav">
        <a href="main.html" class="nav-link">
          <span class="icon icon-home"></span>
          <span>Home</span>
        </a>
        <a href="playlist.html" class="nav-link active">
          <span class="icon icon-playlist"></span>
          <span>Playlist</span>
        </a>
      </nav>
    </header>

    <!-- Основной контент страницы -->
    <main class="main-content">
      <section class="podcast-hero">
        <div class="container hero-container">
          <div
            class="hero-cover"
            style="background: linear-gradient(135deg, #a03b5a, #621b2f)">
            <div class="cover-placeholder-text">ОБЛОЖКА</div>
          </div>
          <div class="hero-details">
            <h1 class="podcast-title">MY PLAYLIST</h1>
            <div class="podcast-meta-author">
              <div class="author-avatar" style="background: #d9d9d9"></div>
              <span class="author-name">M</span>
              <span class="meta-dot">•</span>
              <span>162 трека, 8 ч. 30 мин.</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Контент плейлиста -->
      <div class="container">
        <!-- Панель управления (Играть, Перетасовать, Добавить) -->
        <div class="controls-bar">
          <button class="main-play-btn" title="Воспроизвести">
            <span class="icon icon-play play-icon-inner"></span>
          </button>

          <button class="action-icon-btn" title="Перемешать">
            <span class="icon icon-shuffle"></span>
          </button>

          <button class="action-icon-btn" title="Добавить">
            <span class="icon icon-plus"></span>
          </button>
        </div>

        <!-- Таблица списка плейлиста -->
        <section class="playlist-list">
          <!-- Шапка таблицы -->
          <div class="playlist-list-header">
            <span class="header-num">#</span>
            <span class="header-title">Название</span>
            <span class="header-album">Альбом</span>
            <span class="header-time">
              <span class="icon icon-clock"></span>
            </span>
          </div>

          <hr class="playlist-divider" />

          <!-- Тело таблицы -->
          <div class="playlist-list-body">
            <!-- Трек 1 -->
            <div class="playlist-row active-row">
              <div class="track-num">
                <span class="num-text">1</span>
                <span class="icon icon-pause num-play"></span>
              </div>
              <div class="track-info-block">
                <div
                  class="track-thumb"
                  style="
                    background: linear-gradient(135deg, #ff9a9e, #fecfef);
                  "></div>
                <div class="track-text">
                  <h4 class="track-title">танцор</h4>
                  <p class="track-author">
                    <span class="explicit-badge">E</span> madk1d
                  </p>
                </div>
              </div>
              <div class="track-album">sexyswag</div>
              <div class="track-meta">
                <span
                  class="icon icon-check-mark added-check"
                  title="Добавлено"></span>
                <span class="track-duration">1:28</span>
              </div>
            </div>

            <!-- Трек 2 -->
            <div class="playlist-row">
              <div class="track-num">
                <span class="num-text">2</span>
                <span class="icon icon-play num-play"></span>
              </div>
              <div class="track-info-block">
                <div
                  class="track-thumb"
                  style="
                    background: linear-gradient(135deg, #a03b5a, #621b2f);
                  "></div>
                <div class="track-text">
                  <h4 class="track-title">так похуй</h4>
                  <p class="track-author">
                    <span class="explicit-badge">E</span> madk1d
                  </p>
                </div>
              </div>
              <div class="track-album">sexyswag</div>
              <div class="track-meta">
                <span
                  class="icon icon-check-mark added-check"
                  title="Добавлено"></span>
                <span class="track-duration">1:48</span>
              </div>
            </div>

            <!-- Трек 3 -->
            <div class="playlist-row">
              <div class="track-num">
                <span class="num-text">3</span>
                <span class="icon icon-play num-play"></span>
              </div>
              <div class="track-info-block">
                <div
                  class="track-thumb"
                  style="
                    background: linear-gradient(135deg, #1e3c72, #2a5298);
                  "></div>
                <div class="track-text">
                  <h4 class="track-title">Tech News Briefing - Dec 13</h4>
                  <p class="track-author">The Wall Street Journal</p>
                </div>
              </div>
              <div class="track-album">WSJ Tech News</div>
              <div class="track-meta">
                <span
                  class="icon icon-check-mark added-check"
                  title="Добавлено"></span>
                <span class="track-duration">12:45</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Фиксированный плеер -->
    <aside class="player">
      <div class="player-progress-top">
        <div class="progress-fill"></div>
      </div>

      <div class="player-left">
        <button
          type="button"
          class="control-btn"
          id="prev-btn"
          title="Предыдущий">
          <span class="icon icon-previous"></span>
        </button>
        <button type="button" class="control-btn" id="play-btn" title="Пауза">
          <span class="icon icon-pause"></span>
        </button>
        <button
          type="button"
          class="control-btn"
          id="next-btn"
          title="Следующий">
          <span class="icon icon-next"></span>
        </button>
        <span class="time-display">1:02 / 3:36</span>
      </div>

      <div class="player-center">
        <div
          class="player-thumbnail"
          style="background: linear-gradient(135deg, #ff9a9e, #fecfef)"></div>
        <div class="player-text">
          <h4 class="player-title">танцор</h4>
          <p class="player-author">madk1d</p>
        </div>
        <button
          type="button"
          class="control-btn add-track-btn"
          id="add-btn"
          title="Добавить">
          <span class="icon icon-plus"></span>
        </button>
      </div>

      <div class="player-right">
        <button type="button" class="control-btn" title="Громкость">
          <span class="icon icon-volume"></span>
        </button>
        <button type="button" class="control-btn" title="Скорость">
          <span class="icon icon-speed"></span>
        </button>
        <button type="button" class="control-btn" title="Перемешать">
          <span class="icon icon-shuffle"></span>
        </button>
      </div>
    </aside>
  </body>
</html>
